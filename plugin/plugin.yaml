# Latent Protocol — Hermes Plugin
#
# Install (recommended):
#   npx latent init
# Manual:
#   pip install latent-protocol
#   # copy this directory flat to ~/.hermes/plugins/agent-ads/
#   hermes plugins enable agent-ads

name: agent-ads
version: "0.1.0"
description: "Earn USDC while your agent works. Open ad marketplace for AI agents on Base."
author: "Latent Market"
license: Apache-2.0
homepage: "https://github.com/enzoonchain/latent-market"

requires_env: []

provides_hooks:
  - pre_llm_call
  - transform_llm_output

config:
  ads.wallet: ""
  ads.enabled: true
  ads.frequency: 5
  ads.categories:
    - all
  ads.server: "https://api.latentprotocol.xyz"
  ads.min_payout: 5.0
