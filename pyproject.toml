# Latent Protocol — client SDK and platform adapters
#
# This package is the *client* half of Latent Protocol: the adapters that
# render sponsored lines inside AI agents, the MCP server, and the reporting
# client that talks to an ad server over the public HTTP contract
# (see protocol/openapi.yaml). The ad server itself is a separate, private
# service — nothing in this package needs it to be developed or tested; use
# the mock ad server in tools/ instead.

[project]
name = "latent-protocol"
version = "0.1.0"
description = "Client SDK and platform adapters for Latent Protocol — earn USDC while your AI agent thinks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Latent Protocol"},
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Client-side MCP server (runs on the user's machine).
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
latent-mcp           = "latent_protocol.mcp_server:main"
latent-setup         = "latent_protocol.setup:main"
latent-adapter       = "latent_protocol.adapters.unified:adapter_main"
latent-statusline    = "latent_protocol.adapters.claude_code:statusline_main"
latent-hermes-patch  = "latent_protocol.adapters.hermes_webui:main"

# Hermes discovers pip plugins via this entry-point group.
# After `pip install latent-protocol`: `hermes plugins enable agent-ads`
[project.entry-points."hermes_agent.plugins"]
agent-ads = "latent_protocol.adapters.hermes:register"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "latent_protocol",
    "latent_protocol.adapters",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
