name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python client SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Lint (ruff) — non-blocking
        continue-on-error: true
        run: ruff check .

  cli:
    name: CLI + adapters (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor we support; 22 is where `node:sqlite` ships. The
        # scanner's SQLite path (Hermes' full history, Codex's state.sqlite,
        # OpenClaw's index) only ever runs for real on 22 — on 20 it falls
        # back to file scanning and the SQLite tests skip themselves. A bug
        # confined to that path — as the ESM `require("node:module")` one in
        # cli/src/scanners/sqlite.ts was — is invisible on 20 alone.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install CLI deps
        run: npm ci --prefix cli

      - name: Typecheck
        run: npm run typecheck --prefix cli

      - name: Build
        run: npm run build --prefix cli

      - name: Tests
        run: node --test cli/tests/*.test.mjs

      # The SQLite-backed tests skip themselves on runtimes with no reader
      # rather than failing, so a broken reader stays silent unless at least
      # one CI leg actually exercises it. Node 22 always has node:sqlite, so
      # a skip there means the reader itself is broken, not just absent.
      - name: SQLite reader actually ran (Node 22+ only)
        if: ${{ matrix.node-version == '22' }}
        run: |
          if node --test cli/tests/hermes-sessions.test.mjs 2>&1 | tee /tmp/hermes-test.log \
               | grep -q "skipped: no node:sqlite"; then
            echo "::error::node:sqlite is unavailable on Node ${{ matrix.node-version }} — the SQLite reader never ran"
            exit 1
          fi
          echo "OK — SQLite reader exercised on Node ${{ matrix.node-version }}"

      # `latent` on npm is an unrelated placeholder package, so `npx latent …`
      # in docs or code sends users to somebody else's code. The published
      # package is `latent-protocol`; only the local bin is named `latent`.
      - name: No bare `npx latent` invocations
        if: ${{ matrix.node-version == '20' }}
        run: |
          if grep -rn "npx latent[^-]" --include="*.md" --include="*.ts" \
               --include="*.py" --include="*.mjs" --include="*.json" . \
               | grep -v node_modules | grep -v "/dist/"; then
            echo "::error::use 'npx latent-protocol', not 'npx latent'"
            exit 1
          fi
          echo "OK — no bare 'npx latent' invocations"

  openclaw-plugin:
    name: OpenClaw plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --include=dev --prefix openclaw-plugin

      - name: Typecheck
        run: npm run typecheck --prefix openclaw-plugin

      - name: Tests
        run: npm test --prefix openclaw-plugin

      - name: Build
        run: npm run build --prefix openclaw-plugin

      # cli/templates/openclaw-plugin/dist is a vendored copy of the plugin
      # build, shipped inside the npm package so `npx latent-protocol init`
      # can install it without the monorepo. If a PR edits the plugin source
      # without re-running scripts/sync-openclaw-template.sh, users get stale
      # code — so fail the build rather than shipping the drift.
      - name: Template is in sync with plugin source
        run: |
          if ! diff -r openclaw-plugin/dist cli/templates/openclaw-plugin/dist; then
            echo "::error::cli/templates/openclaw-plugin/dist is stale — run: bash scripts/sync-openclaw-template.sh"
            exit 1
          fi

  vscode-extension:
    name: VS Code / Cursor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --include=dev --prefix vscode-extension

      - name: Typecheck
        run: npm run typecheck --prefix vscode-extension

      - name: Tests
        run: npm test --prefix vscode-extension

      - name: Build (esbuild bundle)
        run: npm run build --prefix vscode-extension

      - name: Bundle is self-contained (only `vscode` external)
        run: |
          node -e '
            const s = require("node:fs").readFileSync("vscode-extension/dist/extension.js","utf8");
            const ext = [...s.matchAll(/require\("([^"]+)"\)/g)].map(m=>m[1])
              .filter(x => x !== "vscode" && !x.startsWith("node:"));
            if (ext.length) { console.error("unbundled:", ext); process.exit(1); }
            console.log("dist/extension.js: only vscode + node: builtins");
          '

  contract:
    name: Protocol contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate OpenAPI spec parses
        run: |
          pip install pyyaml
          python -c "
          import yaml, sys
          spec = yaml.safe_load(open('protocol/openapi.yaml'))
          assert spec['openapi'].startswith('3.'), 'missing openapi version'
          assert spec['paths'], 'no paths defined'
          print(f\"OK — {len(spec['paths'])} paths, {len(spec['components']['schemas'])} schemas\")
          "

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mock ad server starts and serves the contract
        run: |
          node tools/mock-ad-server.mjs --port=8899 &
          sleep 2
          curl -sf http://127.0.0.1:8899/health
          curl -sf -X POST http://127.0.0.1:8899/ad/request \
            -H 'Content-Type: application/json' \
            -d '{"user_wallet":"0x1111111111111111111111111111111111111111","agent":"ci","surface":"status_line","context":"devops"}' \
            | grep -q impression_token
          echo "mock ad server OK"
