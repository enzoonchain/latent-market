name: Publish CLI to npm

# Publishes `cli/` (package `latent-protocol`) to the npm registry.
#
# Trigger: merging a version bump. A push to main that changes
# cli/package.json publishes that version if it is not on npm yet, then
# creates the matching `cli-v<version>` GitHub Release on the merge commit —
# so a fix PR that carries its own bump releases itself, no manual step.
# (That release is made with GITHUB_TOKEN, so it does not re-trigger this
# workflow.)
#
# Also: a GitHub Release whose tag is `cli-v<semver>` created by hand (e.g.
# cli-v0.1.4 or cli-v0.1.4-beta.1), or a manual run. The tag version must
# match cli/package.json's version or the job fails before publishing.
#
# Prerelease versions (semver with a `-`, e.g. 0.1.4-beta.1) publish to the
# `beta` dist-tag. A first public beta also points `latest` at that version
# so `npx latent-protocol` resolves until a stable release exists.
#
# Auth: NPM_TOKEN repo secret (automation token with publish rights), or
# npm trusted publishing on this workflow once the package exists.
# Provenance is attested via OIDC (id-token: write).

on:
  push:
    branches: [main]
    paths: [cli/package.json]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only; do not publish"
        type: boolean
        default: true
      also_tag_latest:
        description: "Also point the latest dist-tag at this version (use for the first public beta)"
        type: boolean
        default: false

permissions:
  contents: write # gh release create (push trigger)
  id-token: write # npm provenance + trusted publishing

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  # On push: is cli/package.json's version new? A package.json edit that
  # keeps the version (deps, scripts) must not publish anything.
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          VER=$(node -p "require('./cli/package.json').version")
          NAME=$(node -p "require('./cli/package.json').name")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npm — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VER is new — releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.release.tag_name, 'cli-v') ||
       (github.event_name == 'push' && needs.detect.outputs.release == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci --prefix cli

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./cli/package.json').version")
          TAG="${GITHUB_REF_NAME#cli-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::release tag cli-v$TAG != cli/package.json version $PKG"
            exit 1
          fi

      - name: Resolve dist-tag
        id: dist
        run: |
          VER=$(node -p "require('./cli/package.json').version")
          NAME=$(node -p "require('./cli/package.json').name")
          if [[ "$VER" == *-* ]]; then
            DIST_TAG=beta
          else
            DIST_TAG=latest
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VER with dist-tag $DIST_TAG"

      - name: Build + typecheck + test
        run: |
          npm run typecheck --prefix cli
          npm run build --prefix cli
          node --test cli/tests/*.test.mjs

      - name: Pack and inspect
        run: |
          cd cli
          npm pack --dry-run
          # The published bundle must be self-contained — no bare imports left.
          node -e '
            const s = require("node:fs").readFileSync("dist/index.js", "utf8");
            const bad = [...s.matchAll(/from ?"([^".][^"]*)"/g)].map(m => m[1])
              .filter(x => !x.startsWith("node:"));
            if (bad.length) { console.error("unbundled imports:", bad); process.exit(1); }
            console.log("dist/index.js is self-contained");
          '

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: cli
        run: npm publish --dry-run --provenance --access public --tag ${{ steps.dist.outputs.tag }}

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        working-directory: cli
        run: npm publish --provenance --access public --tag ${{ steps.dist.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Also point latest at this beta
        if: >-
          steps.dist.outputs.tag == 'beta' &&
          (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && inputs.also_tag_latest))
        run: npm dist-tag add ${{ steps.dist.outputs.name }}@${{ steps.dist.outputs.version }} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release for this version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.dist.outputs.version }}
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          TAG="cli-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
            exit 0
          fi
          # Title after the merged PR, like the hand-made releases.
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].title // empty' || true)
          TITLE="cli v$VER${PR_TITLE:+ — $PR_TITLE}"
          FLAGS=()
          if [ "$DIST_TAG" = beta ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes "${FLAGS[@]}"
